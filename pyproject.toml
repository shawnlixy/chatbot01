[project]
name = "chatbot01"
version = "0.1.0"
description = "FastAPI chatbot with pluggable Mem0 long-term memory"
readme = "README.md"
authors = [
    { name = "shawnlixy", email = "lixy_0101@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mem0ai>=2.0.20",
    "openai>=3.8.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
